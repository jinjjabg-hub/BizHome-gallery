<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>비즈홈 갤러리 | TM LINK 디지털 비즈홈 모음</title>
<meta name="description" content="TM LINK가 제작한 비즈홈(디지털 명함) 갤러리. 실제 제작 사례를 확인하세요."/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #faf8f3;
  --card: #ffffff;
  --card2: #f3efe6;
  --border: #e6e0d2;
  --gold: #a87a00;
  --gold2: #c99a1a;
  --white: #2a2a2a;
  --muted: #7a7466;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--white);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
  vertical-align: middle;
}

/* HEADER */
header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(250,248,243,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 48px; height: 64px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo { font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 800; color: var(--gold); letter-spacing: 0.04em; text-decoration: none; }
.header-right { display: flex; align-items: center; gap: 16px; }
.back-btn {
  display: flex; align-items: center; gap: 6px;
  color: var(--muted); font-size: 13px;
  text-decoration: none; transition: color 0.2s;
}
.back-btn:hover { color: var(--gold); }
.count-badge {
  background: rgba(201,154,26,0.12);
  border: 1px solid rgba(201,154,26,0.35);
  color: var(--gold); font-size: 12px; font-weight: 600;
  padding: 4px 12px; border-radius: 20px;
}

/* HERO */
.gallery-hero {
  padding: 60px 48px 40px;
  text-align: center;
  background: radial-gradient(ellipse at top, rgba(242,200,80,0.28) 0%, transparent 65%);
}
.gallery-hero h1 {
  font-family: 'Montserrat', sans-serif;
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 800; letter-spacing: -0.02em;
  margin-bottom: 12px;
}
.gallery-hero h1 span { color: var(--gold); }
.gallery-hero p { color: var(--muted); font-size: 15px; line-height: 1.7; }

/* FILTERS */
.filter-bar {
  padding: 0 48px 32px;
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap;
}
.filter-label { font-size: 11px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-right: 6px; }
.filter-btn {
  padding: 7px 16px; border-radius: 20px;
  border: 1px solid var(--border);
  background: #fff; color: var(--muted);
  font-size: 12px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; font-family: 'Inter', sans-serif;
}
.filter-btn:hover { border-color: var(--gold); color: var(--gold); }
.filter-btn.active { background: var(--gold); border-color: var(--gold); color: #fff; }

/* SEARCH */
.search-wrap {
  padding: 0 48px 32px;
  display: flex; gap: 12px;
}
.search-input {
  flex: 1; max-width: 360px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 16px 10px 40px;
  color: var(--white); font-size: 14px;
  font-family: 'Inter', sans-serif;
  outline: none; transition: border-color 0.2s;
  position: relative;
}
.search-input:focus { border-color: var(--gold); }
.search-wrap-inner { position: relative; flex: 1; max-width: 360px; }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; }

/* GRID */
.gallery-grid {
  padding: 0 48px 80px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}

/* CARD */
.dica-card {
  box-shadow: 0 2px 8px rgba(60,50,20,0.06);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.23,1,0.32,1);
  text-decoration: none; color: inherit;
  display: block;
  position: relative;
}
.dica-card:hover {
  border-color: var(--gold);
  transform: translateY(-8px);
  box-shadow: 0 20px 40px rgba(168,122,0,0.15);
}
.card-cover {
  height: 44px; width: 44px; position: relative;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; border-radius: 11px; flex-shrink: 0;
}
.card-cover-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: none;
}
.card-cover-char {
  font-family: 'Montserrat', sans-serif;
  font-size: 18px; font-weight: 800;
  opacity: 0.9; line-height: 1; color: #6b5200;
}
.card-top { display: flex; align-items: center; gap: 12px; padding: 16px 44px 0 18px; }
.card-title-wrap { min-width: 0; flex: 1; }
.card-name-row { display: block; }
.card-tier-badge {
  position: absolute; top: 14px; right: 14px;
  font-size: 8px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; padding: 2px 8px;
  border-radius: 20px; border: 1px solid var(--border);
  color: var(--muted); white-space: nowrap;
}
.card-chapter {
  font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
  color: var(--gold); opacity: 0.75; white-space: nowrap;
}
.card-body { padding: 10px 18px 16px; }
.card-name { font-family: 'Montserrat', sans-serif; font-size: 16px; font-weight: 700; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-role { font-size: 10px; color: var(--gold); letter-spacing: 0.06em; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-company { font-size: 12px; color: var(--muted); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.card-category {
  font-size: 10px; padding: 3px 9px;
  background: rgba(201,154,26,0.1);
  border: 1px solid rgba(201,154,26,0.28);
  border-radius: 20px; color: var(--gold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%;
}
.card-link-icon { color: var(--muted); font-size: 18px; transition: color 0.2s; }
.dica-card:hover .card-link-icon { color: var(--gold); }
.card-actions { display: flex; align-items: center; gap: 6px; }
.card-share-btn {
  display: flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); cursor: pointer; transition: all 0.2s;
}
.card-share-btn:hover { border-color: #d4b800; color: #8a7600; background: rgba(254,229,0,0.25); }
.card-share-btn .material-symbols-outlined { font-size: 16px; }

/* GALLERY SHARE BUTTON (header) */
.gallery-share-btn {
  display: flex; align-items: center; gap: 6px;
  background: transparent;
  border: 1px solid rgba(201,154,26,0.4);
  color: var(--gold); font-size: 12px; font-weight: 600;
  padding: 6px 14px; border-radius: 20px;
  cursor: pointer; transition: all 0.2s;
  font-family: 'Inter', sans-serif;
}
.gallery-share-btn:hover { background: rgba(201,154,26,0.12); border-color: var(--gold); }
.gallery-share-btn .material-symbols-outlined { font-size: 16px; }
@media (max-width: 480px) {
  .gallery-share-btn span:not(.material-symbols-outlined) { display: none; }
}

/* TOAST */
#toast {
  position: fixed; bottom: 32px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #FEE500; color: #191919;
  font-size: 13px; font-weight: 600;
  padding: 12px 24px; border-radius: 30px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  opacity: 0; pointer-events: none;
  transition: all 0.3s cubic-bezier(0.23,1,0.32,1);
  z-index: 100;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* EMPTY */
.empty-state {
  grid-column: 1 / -1;
  text-align: center; padding: 80px 20px;
  color: var(--muted);
}
.empty-state .material-symbols-outlined { font-size: 48px; opacity: 0.3; display: block; margin-bottom: 16px; }

/* ADD CARD */
.add-card {
  background: transparent;
  border: 2px dashed var(--border);
  border-radius: 16px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; padding: 40px 20px;
  cursor: default; min-height: 220px;
  transition: border-color 0.2s;
}
.add-card:hover { border-color: rgba(201,154,26,0.5); }
.add-card .material-symbols-outlined { color: #cfc8b6; font-size: 36px; }
.add-card p { color: #b5ad9a; font-size: 12px; text-align: center; line-height: 1.6; }

/* COVER COLORS */
.cover-0 { background: linear-gradient(135deg, #fff3cf, #ffe7a0); }
.cover-1 { background: linear-gradient(135deg, #d8f1ee, #bfe4df); }
.cover-2 { background: linear-gradient(135deg, #f7ddf1, #eec4e5); }
.cover-3 { background: linear-gradient(135deg, #dbe8fa, #c3d7f2); }
.cover-4 { background: linear-gradient(135deg, #e6dcf8, #d3c4f0); }
.cover-5 { background: linear-gradient(135deg, #fbdcd8, #f4c3bd); }
.cover-6 { background: linear-gradient(135deg, #dcf2dc, #c2e5c3); }

/* FOOTER */
footer {
  border-top: 1px solid var(--border);
  padding: 32px 48px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 16px;
}
footer .logo { font-size: 15px; }
footer p { font-size: 12px; color: var(--muted); }
footer a { color: var(--gold); text-decoration: none; font-size: 12px; }

/* MOBILE */
@media (max-width: 768px) {
  header { padding: 0 20px; }
  .gallery-hero { padding: 40px 20px 28px; }
  .filter-bar { padding: 0 20px 20px; }
  .search-wrap { padding: 0 20px 20px; }
  .gallery-grid { padding: 0 20px 60px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card-top { padding: 13px 40px 0 14px; gap: 9px; }
  .card-cover { height: 36px; width: 36px; border-radius: 9px; }
  .card-cover-char { font-size: 15px; }
  .card-body { padding: 8px 14px 13px; }
  .card-name { font-size: 14px; }
  footer { padding: 24px 20px; flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <a class="logo" href="https://jinjjabg-hub.github.io/T.M-LINK/">◆ TM LINK</a>
  <div class="header-right">
    <span class="count-badge" id="count-badge">0 cards</span>
    <button class="gallery-share-btn" id="gallery-share-btn">
      <span class="material-symbols-outlined">share</span><span>갤러리 공유</span>
    </button>
    <a class="back-btn" href="https://jinjjabg-hub.github.io/T.M-LINK/">
      <span class="material-symbols-outlined" style="font-size:18px;">arrow_back</span> 홈으로
    </a>
  </div>
</header>

<!-- HERO -->
<div class="gallery-hero">
  <h1>비즈홈 <span>갤러리</span></h1>
  <p>TM LINK가 제작한 비즈홈 실제 사례 모음.<br/>클릭하면 실제 비즈홈이 열립니다.</p>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <div class="search-wrap-inner">
    <span class="material-symbols-outlined search-icon">search</span>
    <input class="search-input" id="search-input" type="text" placeholder="이름, 회사명으로 검색..."/>
  </div>
</div>

<!-- FILTERS -->
<div class="filter-bar">
  <span class="filter-label">필터</span>
  <button class="filter-btn active" data-filter="all">전체</button>
  <button class="filter-btn" data-filter="tier:basic">베이직</button>
  <button class="filter-btn" data-filter="tier:standard">스탠다드</button>
  <button class="filter-btn" data-filter="tier:premium">프리미엄</button>
  <span style="width:1px;height:16px;background:#d9d2c0;margin:0 4px;"></span>
  <button class="filter-btn" data-filter="chapter:BNI 파이오니어">파이오니어</button>
  <button class="filter-btn" data-filter="chapter:BNI 자이언츠">자이언츠</button>
  <button class="filter-btn" data-filter="chapter:general">일반</button>
  <span style="width:1px;height:16px;background:#d9d2c0;margin:0 4px;"></span>
  <button class="filter-btn" data-filter="category:뷰티">뷰티</button>
  <button class="filter-btn" data-filter="category:미디어">미디어</button>
  <button class="filter-btn" data-filter="category:디자인">디자인</button>
  <button class="filter-btn" data-filter="category:헬스">헬스</button>
  <button class="filter-btn" data-filter="category:컨설팅">컨설팅</button>
</div>

<!-- GRID -->
<div class="gallery-grid" id="gallery-grid"></div>

<!-- TOAST -->
<div id="toast"></div>

<!-- FOOTER -->
<footer>
  <a class="logo" href="https://jinjjabg-hub.github.io/T.M-LINK/">◆ TM LINK</a>
  <p>© 2025 TM LINK · 송승훈 대표 · 비즈홈 · 디지털 명함 전문 제작</p>
  <a href="https://jinjjabg-hub.github.io/T.M-LINK/#pricing">제작 의뢰하기 →</a>
</footer>

<script>
let allCards = [];
let activeFilter = 'all';
let searchQuery = '';

// 고정 순서: 파이오니어 비즈홈(1번) → 파이오니어 멤버 → 자이언츠 멤버 → 일반 (그룹 안에서는 cards.json 순서 유지)
function groupOf(c) {
  if (c.pinned) return -1;
  if (c.chapter === 'BNI 파이오니어') return 0;
  if (c.chapter === 'BNI 자이언츠') return 1;
  return 2;
}
function order(arr) {
  return arr.map((c, i) => [c, i]).sort((a, b) => groupOf(a[0]) - groupOf(b[0]) || a[1] - b[1]).map(x => x[0]);
}

// cards.json 로드
fetch('./cards.json')
  .then(r => r.json())
  .then(data => {
    allCards = order(data);
    render();
  })
  .catch(() => {
    // 로드 실패 시 기본 데이터 사용
    allCards = order([
      {"name":"송승훈","company":"T.M Link","role":"대표","url":"https://jinjjabg-hub.github.io/BNI-PIONEER-cards/%EC%86%A1%EC%8A%B9%ED%9B%88/","tier":"standard","category":"컨설팅","chapter":"BNI 파이오니어"},
      {"name":"김지현","company":"감성온도","role":"대표","url":"https://jinjjabg-hub.github.io/BNI-PIONEER-cards/%EA%B9%80%EC%A7%80%ED%98%84/","tier":"standard","category":"기타","chapter":"BNI 파이오니어"},
      {"name":"이화춘","company":"뷰티랩","role":"원장","url":"https://jinjjabg-hub.github.io/BNI-PIONEER-cards/%EC%9D%B4%ED%99%94%EC%B6%98/","tier":"premium","category":"뷰티","chapter":"BNI 파이오니어"},
      {"name":"이서원","company":"웰슨트서원","role":"대표","url":"https://jinjjabg-hub.github.io/NAMECARD/%EC%9D%B4%EC%84%9C%EC%9B%90","tier":"premium","category":"헬스","chapter":"BNI 파이오니어"},
      {"name":"박성준","company":"엘로이미디어","role":"대표","url":"https://jinjjabg-hub.github.io/bni-giants/%EB%B0%95%EC%84%B1%EC%A4%80/index.html","tier":"standard","category":"미디어","chapter":"BNI 자이언츠"},
      {"name":"김준래","company":"무늬디자인","role":"대표","url":"https://jinjjabg-hub.github.io/bni-giants/%EA%B9%80%EC%A4%80%EB%9E%98/index.html","tier":"standard","category":"디자인","chapter":"BNI 자이언츠"}
    ]);
    render();
  });

// 프로필 사진 로드 — 파일명이 명함마다 달라서 순서대로 시도, 다 실패하면 글자 그대로 유지
const PHOTO_FILENAMES = ['profil.png', 'profile.png', 'profil.jpg', 'profile.jpg', 'profil.jpeg', 'profile.jpeg', 'profile.webp'];

function getPhotoBase(url) {
  let base = url.replace(/index\.html?$/, '');
  if (!base.endsWith('/')) base += '/';
  return base;
}

function loadCardPhoto(img, base, idx) {
  if (idx >= PHOTO_FILENAMES.length) return; // 전부 실패 — 뒤에 있는 글자 아바타가 그대로 보임
  img.onerror = () => loadCardPhoto(img, base, idx + 1);
  img.onload = () => { img.style.display = 'block'; const ch = img.parentElement.querySelector('.card-cover-char'); if (ch) ch.style.visibility = 'hidden'; };
  img.src = base + PHOTO_FILENAMES[idx];
}

function render() {
  const grid = document.getElementById('gallery-grid');
  const q = searchQuery.toLowerCase();

  const filtered = allCards.filter(card => {
    const matchSearch = !q ||
      card.name.toLowerCase().includes(q) ||
      card.company.toLowerCase().includes(q) ||
      (card.role && card.role.toLowerCase().includes(q));

    const matchFilter = activeFilter === 'all' ||
      (activeFilter.startsWith('tier:') && (card.tier || '').toLowerCase() === activeFilter.split(':')[1]) ||
      (activeFilter === 'chapter:general' ? groupOf(card) === 2 : (activeFilter.startsWith('chapter:') && card.chapter === activeFilter.split(':')[1])) ||
      (activeFilter.startsWith('category:') && card.category === activeFilter.split(':')[1]);

    return matchSearch && matchFilter;
  });

  document.getElementById('count-badge').textContent = `${filtered.length} cards`;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <span class="material-symbols-outlined">search_off</span>
      <p>조건에 맞는 카드가 없습니다.</p>
    </div>`;
    return;
  }

  const tierLabel = { directory:'DIRECTORY', basic:'BASIC', standard:'STANDARD', premium:'PREMIUM', free:'FREE PRO', enterprise:'ENTERPRISE' };
  const colors = ['cover-0','cover-1','cover-2','cover-3','cover-4','cover-5','cover-6'];

  grid.innerHTML = filtered.map((card, i) => `
    <a class="dica-card" href="${card.url}" target="_blank">
      ${card.tier === 'directory' ? '' : `<span class="card-tier-badge">${tierLabel[(card.tier || '').toLowerCase()] || card.tier}</span>`}
      <div class="card-top">
        <div class="card-cover ${colors[i % colors.length]}">
          <img class="card-cover-img" data-base="${getPhotoBase(card.url)}" alt="">
          <div class="card-cover-char">${card.name.charAt(0)}</div>
        </div>
        <div class="card-title-wrap">
          <div class="card-name-row">
            <span class="card-name">${card.name}</span>
          </div>
          <div class="card-role">${[card.role, card.chapter ? `<span class="card-chapter">${card.chapter}</span>` : ''].filter(Boolean).join(' · ')}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-company">${card.company}</div>
        <div class="card-footer">
          <span class="card-category">${card.category}</span>
          <div class="card-actions">
            <button class="card-share-btn" data-name="${card.name}" data-company="${card.company}" data-url="${card.url}" title="카톡으로 전달하기">
              <span class="material-symbols-outlined">share</span>
            </button>
            <span class="material-symbols-outlined card-link-icon">open_in_new</span>
          </div>
        </div>
      </div>
    </a>
  `).join('') + `
    <div class="add-card">
      <span class="material-symbols-outlined">add_circle</span>
      <p>새 카드 추가 시<br/>cards.json에<br/>한 줄 추가</p>
    </div>
  `;

  grid.querySelectorAll('.card-cover-img').forEach(img => {
    loadCardPhoto(img, img.dataset.base, 0);
  });
}

// 필터
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.getAttribute('data-filter');
    render();
  });
});

// 검색
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

// 카톡으로 전달하기 (공유 버튼)
document.getElementById('gallery-grid').addEventListener('click', e => {
  const btn = e.target.closest('.card-share-btn');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();

  const name = btn.dataset.name;
  const company = btn.dataset.company;
  const url = btn.dataset.url;
  const text = `📇 ${name} | ${company}\n비즈홈 확인하기 👇`;

  if (navigator.share) {
    navigator.share({ title: `${name} 비즈홈`, text, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(`${text}\n${url}`).then(() => {
      showToast('링크 복사 완료! 카톡에 붙여넣기 하세요 💬');
    }).catch(() => {
      showToast('복사에 실패했습니다');
    });
  }
});

let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}
